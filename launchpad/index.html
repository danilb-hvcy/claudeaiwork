<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HeyVacay Operations · Launchpad</title>
    <meta name="description" content="HeyVacay Employee Launchpad — your unified entry point to every company tool." />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23003D7A'/%3E%3Ctext y='.9em' x='14' font-size='72'%3E%F0%9F%8C%B4%3C/text%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Poppins:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <!-- Animated ocean backdrop (shared across states) -->
    <div class="ocean" aria-hidden="true">
      <div class="ocean__glow ocean__glow--1"></div>
      <div class="ocean__glow ocean__glow--2"></div>
      <div class="ocean__watermark">🌴</div>
      <svg class="ocean__waves" viewBox="0 0 1440 320" preserveAspectRatio="none" aria-hidden="true">
        <path class="wave wave--back" d="M0,160 C240,220 480,100 720,160 C960,220 1200,100 1440,160 L1440,320 L0,320 Z"></path>
        <path class="wave wave--mid" d="M0,200 C240,140 480,260 720,200 C960,140 1200,260 1440,200 L1440,320 L0,320 Z"></path>
        <path class="wave wave--front" d="M0,240 C240,290 480,190 720,240 C960,290 1200,190 1440,240 L1440,320 L0,320 Z"></path>
      </svg>
    </div>

    <!-- App root — rendered by app.js -->
    <div id="app" aria-live="polite"></div>

    <!-- Toast container -->
    <div id="toast-stack" class="toast-stack" aria-live="assertive"></div>

    <script src="app.js" defer></script>
  </body>
</html>
