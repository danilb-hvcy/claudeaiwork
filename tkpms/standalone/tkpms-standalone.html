<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TKPMS · Turkish Passenger Management System (Standalone)</title>
    <style>
      :root {
        --tk-blue: #003da5;
        --tk-blue-dark: #002a73;
        --tk-gold: #d4a574;
        --success: #28a745;
        --error: #dc3545;
        --warning: #e8920a;
        --neutral: #6c757d;
        --bg: #eef1f6;
        --panel: #ffffff;
        --border: #d7deea;
        --text: #1f2733;
        --muted: #6c757d;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; }
      body {
        font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: var(--bg);
        color: var(--text);
        font-size: 14px;
      }
      button {
        font-family: inherit;
        cursor: pointer;
        border: none;
        border-radius: 6px;
        padding: 9px 16px;
        font-size: 14px;
        font-weight: 600;
        transition: filter .15s, background .15s;
      }
      button:hover { filter: brightness(0.95); }
      button:disabled { opacity: .5; cursor: not-allowed; }
      .btn-primary { background: var(--tk-blue); color: #fff; }
      .btn-gold { background: var(--tk-gold); color: #3a2a12; }
      .btn-success { background: var(--success); color: #fff; }
      .btn-danger { background: var(--error); color: #fff; }
      .btn-ghost { background: #eef1f6; color: var(--tk-blue); border: 1px solid var(--border); }
      .btn-sm { padding: 5px 10px; font-size: 12px; }
      input, select, textarea {
        font-family: inherit;
        font-size: 14px;
        padding: 9px 11px;
        border: 1px solid var(--border);
        border-radius: 6px;
        width: 100%;
        background: #fff;
        color: var(--text);
      }
      input:focus, select:focus, textarea:focus {
        outline: none;
        border-color: var(--tk-blue);
        box-shadow: 0 0 0 3px rgba(0,61,165,.12);
      }
      label { display: block; font-weight: 600; margin-bottom: 5px; font-size: 12.5px; color: #3a4452; }
      .field { margin-bottom: 13px; }
      .row { display: flex; gap: 13px; flex-wrap: wrap; }
      .row > .field { flex: 1; min-width: 140px; }
      .panel {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 20px;
        box-shadow: 0 1px 3px rgba(20,40,80,.05);
      }
      h1,h2,h3,h4 { margin: 0 0 12px; }
      h2 { font-size: 19px; color: var(--tk-blue-dark); }
      h3 { font-size: 16px; }
      .muted { color: var(--muted); }
      .tag {
        display: inline-block; padding: 2px 8px; border-radius: 20px;
        font-size: 11px; font-weight: 700; letter-spacing: .3px;
      }
      .tag-blue { background: #e3ecfb; color: var(--tk-blue); }
      .tag-green { background: #e2f5e9; color: var(--success); }
      .tag-gold { background: #f6ecdc; color: #9a6f33; }
      .tag-gray { background: #eceff3; color: var(--neutral); }

      /* ---------- Login ---------- */
      .login-wrap {
        min-height: 100vh; display: flex; align-items: center; justify-content: center;
        background: linear-gradient(135deg, var(--tk-blue) 0%, var(--tk-blue-dark) 100%);
      }
      .login-card {
        background: #fff; border-radius: 14px; padding: 40px 36px; width: 380px;
        box-shadow: 0 18px 50px rgba(0,0,0,.3);
      }
      .login-logo { text-align: center; margin-bottom: 22px; }

      /* ---------- App shell ---------- */
      .app-shell { min-height: 100vh; display: flex; flex-direction: column; }
      header.topbar {
        background: var(--tk-blue); color: #fff; display: flex; align-items: center;
        padding: 0 22px; height: 60px; gap: 26px; position: sticky; top: 0; z-index: 50;
        box-shadow: 0 2px 8px rgba(0,0,0,.15);
      }
      .brand { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 18px; letter-spacing: .5px; }
      .brand .roundel {
        width: 32px; height: 32px; border-radius: 50%; background: var(--tk-gold);
        display: flex; align-items: center; justify-content: center; color: var(--tk-blue-dark);
        font-weight: 900; font-size: 13px;
      }
      nav.tabs { display: flex; gap: 4px; flex: 1; }
      nav.tabs button {
        background: transparent; color: #cdd9f0; border-radius: 8px 8px 0 0;
        padding: 8px 18px; font-weight: 700; letter-spacing: .4px; font-size: 13px;
      }
      nav.tabs button.active { background: var(--bg); color: var(--tk-blue); }
      .user-box { display: flex; align-items: center; gap: 12px; font-size: 13px; }
      main.content { flex: 1; padding: 22px; max-width: 1280px; width: 100%; margin: 0 auto; }
      footer.statusbar {
        background: #18222f; color: #aab6c6; font-size: 12px; padding: 8px 22px;
        display: flex; justify-content: space-between; align-items: center;
      }
      .status-dot { display:inline-block; width:8px; height:8px; border-radius:50%; background: var(--success); margin-right:6px; }

      .grid-2 { display: grid; grid-template-columns: 360px 1fr; gap: 20px; align-items: start; }
      @media (max-width: 900px) { .grid-2 { grid-template-columns: 1fr; } }

      table.data { width: 100%; border-collapse: collapse; }
      table.data th, table.data td { text-align: left; padding: 9px 10px; border-bottom: 1px solid var(--border); }
      table.data th { font-size: 12px; text-transform: uppercase; color: var(--muted); letter-spacing: .4px; }
      table.data tr:hover td { background: #f7f9fc; }

      .alert { padding: 11px 14px; border-radius: 8px; margin-bottom: 14px; font-weight: 600; }
      .alert-error { background: #fbe3e6; color: #9a1f2b; border: 1px solid #f3c2c8; }
      .alert-success { background: #e2f5e9; color: #1c6b32; border: 1px solid #bfe6cc; }
      .alert-info { background: #e3ecfb; color: #1d3f7a; border: 1px solid #c4d6f3; }

      /* ---------- Modal ---------- */
      .modal-overlay {
        position: fixed; inset: 0; background: rgba(14,22,36,.55);
        display: flex; align-items: flex-start; justify-content: center; z-index: 100;
        padding: 30px; overflow: auto;
      }
      .modal {
        background: #fff; border-radius: 12px; padding: 22px; max-width: 920px; width: 100%;
        box-shadow: 0 20px 60px rgba(0,0,0,.35);
      }
      .modal-head { display:flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
      .close-x { background: #eef1f6; color: #444; border-radius: 50%; width: 32px; height: 32px; padding:0; font-size:18px; line-height:1; }

      /* ---------- Seat map ---------- */
      .seatmap { display: flex; flex-direction: column; gap: 4px; }
      .seat-section-label { font-weight: 800; color: var(--tk-blue); margin: 14px 0 6px; letter-spacing:.5px; font-size: 13px; }
      .seat-row { display: flex; align-items: center; gap: 4px; }
      .seat-row .rownum { width: 26px; text-align: right; font-size: 11px; color: var(--muted); font-weight:700; }
      .seat {
        width: 30px; height: 30px; border-radius: 6px 6px 4px 4px; font-size: 10px; font-weight: 700;
        display: flex; align-items: center; justify-content: center; border: 1px solid rgba(0,0,0,.12);
        user-select: none;
      }
      .seat.aisle-gap { margin-right: 16px; }
      .seat-avail { background: #e2f5e9; color: #1c6b32; cursor: pointer; }
      .seat-avail:hover { background: var(--success); color:#fff; }
      .seat-taken { background: var(--tk-blue); color: #fff; cursor: pointer; }
      .seat-blocked { background: #d7dde5; color: #888; }
      .seat-selected { background: var(--tk-gold); color: #3a2a12; box-shadow: 0 0 0 2px var(--warning); }
      .seat-exit { box-shadow: inset 0 0 0 2px var(--warning); }
      .exit-marker { font-size: 10px; color: var(--warning); font-weight: 800; padding: 0 6px; }
      .legend { display: flex; gap: 16px; flex-wrap: wrap; margin: 8px 0 4px; font-size: 12px; }
      .legend span { display: flex; align-items: center; gap: 6px; }
      .legend .chip { width: 16px; height: 16px; border-radius: 4px; display:inline-block; }

      /* ---------- Boarding pass ---------- */
      .bpass {
        border: 1px solid var(--border); border-radius: 12px; overflow: hidden;
        max-width: 720px; background: #fff; font-family: 'Segoe UI', Arial, sans-serif;
      }
      .bpass-head { background: var(--tk-blue); color: #fff; padding: 12px 18px; display:flex; justify-content: space-between; align-items:center; }
      .bpass-body { display: flex; }
      .bpass-main { flex: 1; padding: 16px 18px; }
      .bpass-stub { width: 220px; border-left: 2px dashed var(--border); padding: 16px; background: #fafbfd; }
      .bp-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px 18px; margin-bottom: 12px; }
      .bp-field .lbl { font-size: 10px; text-transform: uppercase; color: var(--muted); letter-spacing:.5px; }
      .bp-field .val { font-size: 16px; font-weight: 700; }
      .bp-notice { font-size: 10.5px; color: var(--muted); margin-top: 10px; line-height: 1.4; border-top: 1px solid var(--border); padding-top: 8px; }

      /* ---------- Bag tag ---------- */
      .bagtag {
        width: 300px; border: 2px solid #111; border-radius: 6px; overflow: hidden; background: #fff;
        font-family: 'Arial Narrow', Arial, sans-serif;
      }
      .bagtag-top { background: var(--tk-blue); color: #fff; padding: 6px 10px; display:flex; justify-content: space-between; font-weight: 800; }
      .bagtag-route { font-size: 40px; font-weight: 900; text-align: center; letter-spacing: 4px; padding: 6px 0; border-bottom: 2px solid #111; }
      .bagtag-row { display: flex; justify-content: space-between; padding: 4px 10px; border-bottom: 1px dashed #999; font-size: 12px; }
      .bagtag-barcode { text-align: center; padding: 6px; }

      /* ---------- Boarding mode ---------- */
      .board-scan { font-size: 20px; padding: 18px; text-align: center; letter-spacing: 2px; }
      .board-result {
        border-radius: 12px; padding: 20px; margin-top: 16px; color: #fff; text-align:center;
        animation: pop .2s ease;
      }
      @keyframes pop { from { transform: scale(.96); opacity:.4 } to { transform: scale(1); opacity:1 } }
      .board-ok { background: var(--success); }
      .board-error { background: var(--error); }
      .board-exit { background: var(--warning); }
      .board-result .big-name { font-size: 30px; font-weight: 800; }
      .board-result .big-seat { font-size: 48px; font-weight: 900; letter-spacing: 2px; }
      .counter-pill { background: #fff; color: var(--tk-blue); border-radius: 30px; padding: 8px 20px; font-weight: 800; font-size: 18px; }
      .log-line { font-family: 'Courier New', monospace; font-size: 12.5px; padding: 4px 8px; border-bottom: 1px solid #f0f2f6; }
      .log-exit { background: #fdf3e2; }

      .spinner { display:inline-block; width:16px; height:16px; border:2px solid #fff; border-top-color: transparent; border-radius:50%; animation: spin .7s linear infinite; }
      @keyframes spin { to { transform: rotate(360deg); } }

      /* ---------- Print ---------- */
      @media print {
        body * { visibility: hidden !important; }
        .print-doc, .print-doc * { visibility: visible !important; }
        .print-doc { position: absolute; left: 0; top: 0; width: 100%; padding: 0; }
        .no-print { display: none !important; }
        .modal-overlay { position: absolute; background: #fff; padding: 0; }
        .modal { box-shadow: none; max-width: 100%; }
      }
    </style>
  </head>

    <script>
const {
  useState,
  useEffect,
  useRef,
  useCallback
} = React;
// ===================================================================
//  In-browser data layer — replaces the Express + SQLite backend so
//  the page works standalone from file:// with no server. All data is
//  persisted in localStorage and survives reloads (per browser).
// ===================================================================
const AIRCRAFT = {
  A359: {
    code: 'A359',
    name: 'Airbus A350-900',
    business: {
      rows: 8,
      letters: 'ABCDEFGH',
      startRow: 1
    },
    economy: {
      rows: 18,
      letters: 'ABCDEFGHI',
      startRow: 11
    }
  },
  A332: {
    code: 'A332',
    name: 'Airbus A330-200',
    business: {
      rows: 7,
      letters: 'ABCDEFGH',
      startRow: 1
    },
    economy: {
      rows: 24,
      letters: 'ABCDEFGHI',
      startRow: 11
    }
  },
  A320: {
    code: 'A320',
    name: 'Airbus A320-200',
    business: {
      rows: 5,
      letters: 'ABCDEF',
      startRow: 1
    },
    economy: {
      rows: 30,
      letters: 'ABCDEF',
      startRow: 9
    }
  }
};
const AISLE_AFTER = {
  9: ['C', 'F'],
  8: ['B', 'F'],
  6: ['C']
};
const SEAT_PRICE = {
  Economy: 200,
  Business: 500
};
const EXTRA_BAG_CHARGE = 50;
const AIRLINE_CODE = 'TK';
function exitRowNumbers(cabin) {
  const mid = Math.floor(cabin.rows / 2);
  return [cabin.startRow + mid - 1, cabin.startRow + mid];
}
function buildCabin(cabin, cabinClass) {
  const letters = cabin.letters.split('');
  const aisleAfter = AISLE_AFTER[letters.length] || [];
  const exitRows = cabinClass === 'Economy' ? exitRowNumbers(cabin) : [];
  const rows = [];
  for (let i = 0; i < cabin.rows; i++) {
    const rowNum = cabin.startRow + i;
    const isExit = exitRows.includes(rowNum);
    const seats = letters.map(letter => ({
      id: rowNum + letter,
      row: rowNum,
      letter,
      cabin: cabinClass,
      isExit,
      aisleAfter: aisleAfter.includes(letter)
    }));
    rows.push({
      row: rowNum,
      isExit,
      seats
    });
  }
  return rows;
}
function getSeatMap(type) {
  const cfg = AIRCRAFT[type];
  if (!cfg) return null;
  return {
    code: cfg.code,
    name: cfg.name,
    business: buildCabin(cfg.business, 'Business'),
    economy: buildCabin(cfg.economy, 'Economy')
  };
}
function getCapacity(type) {
  const c = AIRCRAFT[type];
  if (!c) return 0;
  return c.business.rows * c.business.letters.length + c.economy.rows * c.economy.letters.length;
}
function getAllSeats(type) {
  const m = getSeatMap(type);
  if (!m) return [];
  const out = [];
  ['business', 'economy'].forEach(s => m[s].forEach(r => r.seats.forEach(x => out.push(x))));
  return out;
}
function isExitSeat(type, seatId) {
  const s = getAllSeats(type).find(x => x.id === seatId);
  return s ? s.isExit : false;
}

// ----- helpers shared with the boarding-pass barcode (BCBP) -----
function nowISO() {
  return new Date().toISOString();
}
function makeBookingRef() {
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let r = '';
  for (let i = 0; i < 6; i++) r += chars[Math.floor(Math.random() * chars.length)];
  return r;
}
function julianOf(dateStr) {
  const d = dateStr ? new Date(dateStr) : new Date();
  const start = new Date(d.getFullYear(), 0, 0);
  return String(Math.floor((d - start) / 86400000)).padStart(3, '0');
}
function cabinLetterOf(c) {
  return c === 'Business' ? 'J' : 'Y';
}
function padS(s, n) {
  return String(s == null ? '' : s).slice(0, n).padEnd(n, ' ');
}
function padN(n, len) {
  return String(n == null ? '' : n).replace(/\D/g, '').slice(-len).padStart(len, '0');
}
function encodeSeat(seat) {
  if (!seat) return '0000';
  const m = String(seat).match(/^(\d+)([A-Z])$/i);
  if (!m) return padS(seat, 4);
  return padN(m[1], 3) + m[2].toUpperCase();
}
function buildBCBP(d) {
  const name = ((d.lastName || '') + '/' + (d.firstName || '')).toUpperCase();
  return 'M1' + padS(name, 20) + 'E' + padS(d.bookingReference, 7) + padS(d.departure, 3).toUpperCase() + padS(d.arrival, 3).toUpperCase() + padS(AIRLINE_CODE, 2) + padN(d.flightNumber, 4) + julianOf(d.departureTime) + cabinLetterOf(d.cabinClass) + encodeSeat(d.seatAssigned) + padN(d.sequence || 0, 4);
}
function parseBCBP(raw) {
  const s = String(raw || '');
  if (s.length < 54 || s.slice(0, 1).toUpperCase() !== 'M') return null;
  try {
    const name = s.slice(2, 22).trim();
    const parts = name.split('/');
    return {
      name,
      lastName: parts[0] || '',
      firstName: parts[1] || '',
      bookingReference: s.slice(23, 30).trim(),
      departure: s.slice(30, 33).trim(),
      arrival: s.slice(33, 36).trim(),
      carrier: s.slice(36, 38).trim(),
      flightNumber: s.slice(38, 42).replace(/^0+/, ''),
      julian: s.slice(42, 45).trim(),
      cabin: s.slice(45, 46).trim(),
      seat: s.slice(46, 50).replace(/^0+/, '').trim(),
      sequence: parseInt(s.slice(50, 54), 10) || 0
    };
  } catch (e) {
    return null;
  }
}

// ----- persistence -----
const DB_KEY = 'tkpms_db_v1';
function nextId(coll) {
  DB._seq[coll] = (DB._seq[coll] || 0) + 1;
  return DB._seq[coll];
}
function saveDB() {
  try {
    localStorage.setItem(DB_KEY, JSON.stringify(DB));
  } catch (e) {}
}
function freshDB() {
  return {
    _seq: {},
    flights: [],
    passengers: [],
    bookings: [],
    baggage: [],
    checkin: [],
    boarding: []
  };
}
function seedDB() {
  DB = freshDB();
  const samples = [{
    flightNumber: 'TK1',
    departure: 'IST',
    arrival: 'JFK',
    aircraftType: 'A359',
    depOffsetH: 3,
    durH: 11
  }, {
    flightNumber: 'TK79',
    departure: 'IST',
    arrival: 'LAX',
    aircraftType: 'A332',
    depOffsetH: 5,
    durH: 14
  }, {
    flightNumber: 'TK1985',
    departure: 'IST',
    arrival: 'LHR',
    aircraftType: 'A320',
    depOffsetH: 2,
    durH: 4
  }];
  samples.forEach(f => {
    const dep = new Date(Date.now() + f.depOffsetH * 3600000);
    const arr = new Date(dep.getTime() + f.durH * 3600000);
    DB.flights.push({
      id: nextId('flights'),
      flightNumber: f.flightNumber,
      departure: f.departure,
      arrival: f.arrival,
      departureTime: dep.toISOString().slice(0, 16),
      arrivalTime: arr.toISOString().slice(0, 16),
      aircraftType: f.aircraftType,
      status: 'Scheduled',
      createdAt: nowISO()
    });
  });
  const first = DB.flights[0];
  const pid = nextId('passengers');
  DB.passengers.push({
    id: pid,
    flightId: first.id,
    firstName: 'John',
    lastName: 'Doe',
    email: 'john.doe@example.com',
    phone: '+1 555 0100',
    passportNumber: 'U12345678',
    dateOfBirth: '1985-06-15',
    nationality: 'USA',
    createdAt: nowISO()
  });
  DB.bookings.push({
    id: nextId('bookings'),
    passengerId: pid,
    flightId: first.id,
    seatAssigned: '12A',
    cabinClass: 'Economy',
    bookingReference: 'TKDEMO',
    paymentMethod: 'credit_card',
    paymentAmount: 200,
    paymentStatus: 'paid',
    createdAt: nowISO()
  });
  saveDB();
  return DB;
}
let DB;
(function loadDB() {
  try {
    const r = JSON.parse(localStorage.getItem(DB_KEY));
    if (r && r.flights) {
      DB = r;
      return;
    }
  } catch (e) {}
  seedDB();
})();
const byId = (arr, id) => arr.find(x => String(x.id) === String(id));
function getBookingFull(bookingId) {
  const b = byId(DB.bookings, bookingId);
  if (!b) return null;
  const p = byId(DB.passengers, b.passengerId) || {};
  const f = byId(DB.flights, b.flightId) || {};
  const c = DB.checkin.find(x => String(x.bookingId) === String(b.id));
  const bo = DB.boarding.find(x => String(x.bookingId) === String(b.id));
  const bags = DB.baggage.filter(x => String(x.bookingId) === String(b.id));
  const row = {
    id: b.id,
    passengerId: b.passengerId,
    flightId: b.flightId,
    seatAssigned: b.seatAssigned,
    cabinClass: b.cabinClass,
    bookingReference: b.bookingReference,
    paymentMethod: b.paymentMethod,
    paymentAmount: b.paymentAmount,
    paymentStatus: b.paymentStatus,
    createdAt: b.createdAt,
    firstName: p.firstName,
    lastName: p.lastName,
    email: p.email,
    phone: p.phone,
    passportNumber: p.passportNumber,
