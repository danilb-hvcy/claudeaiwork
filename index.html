<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>HCED Portal — HeyVacay</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter','Segoe UI',system-ui,sans-serif;background:#0D2137;color:#fff;min-height:100vh;font-size:14px}
:root{--cyan:#23e3ef;--dark:#0D2137;--navy:#102840;--card:#0E2840;--muted:#7BB5C8;--orange:#F5A623;--border:#1A3A55}
input,textarea,select{font-family:inherit;font-size:14px;background:#0D2137;border:1px solid var(--border);color:#fff;border-radius:6px;padding:10px 12px;width:100%;outline:none;transition:border-color .2s}
input:focus,textarea:focus,select:focus{border-color:var(--cyan)}
input::placeholder,textarea::placeholder{color:var(--muted)}
select option{background:#102840}
label{display:block;margin-bottom:6px;color:var(--muted);font-size:13px;font-weight:500}
.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 20px;border-radius:8px;border:none;cursor:pointer;font-size:14px;font-weight:600;transition:all .2s;font-family:inherit}
.btn-primary{background:var(--cyan);color:#0D2137}
.btn-primary:hover{background:#1bc8d4}
.btn-primary:disabled{background:#1A3A55;color:var(--muted);cursor:not-allowed}
.btn-secondary{background:transparent;color:var(--muted);border:1px solid var(--border)}
.btn-secondary:hover{border-color:var(--cyan);color:var(--cyan)}
.btn-danger{background:#ef4444;color:#fff}
.btn-danger:hover{background:#dc2626}
.btn-sm{padding:6px 14px;font-size:13px}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:24px}
.badge{display:inline-flex;align-items:center;padding:3px 10px;border-radius:20px;font-size:12px;font-weight:600}
.badge-cyan{background:rgba(35,227,239,.15);color:var(--cyan)}
.badge-gray{background:rgba(148,163,184,.15);color:#94a3b8}
.badge-orange{background:rgba(245,166,35,.15);color:var(--orange)}
.badge-green{background:rgba(34,197,94,.15);color:#22c55e}
.badge-red{background:rgba(239,68,68,.15);color:#ef4444}
.sev-0{background:rgba(148,163,184,.2);color:#94a3b8;border:1px solid #94a3b8}
.sev-1{background:rgba(96,165,250,.2);color:#60a5fa;border:1px solid #60a5fa}
.sev-2{background:rgba(202,138,4,.2);color:#ca8a04;border:1px solid #ca8a04}
.sev-3{background:rgba(249,115,22,.2);color:#f97316;border:1px solid #f97316}
.sev-4{background:rgba(239,68,68,.2);color:#ef4444;border:1px solid #ef4444}
.sev-5{background:rgba(220,38,38,.2);color:#dc2626;border:1px solid #dc2626;animation:pulse-red 2s infinite}
@keyframes pulse-red{0%,100%{box-shadow:0 0 0 0 rgba(220,38,38,.4)}50%{box-shadow:0 0 0 6px rgba(220,38,38,0)}}
.status-open{background:rgba(35,227,239,.15);color:var(--cyan)}
.status-under_review{background:rgba(245,166,35,.15);color:var(--orange)}
.status-action_taken{background:rgba(34,197,94,.15);color:#22c55e}
.status-closed{background:rgba(148,163,184,.15);color:#94a3b8}
table{width:100%;border-collapse:collapse}
th{text-align:left;padding:10px 12px;color:var(--muted);font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;border-bottom:1px solid var(--border)}
td{padding:10px 12px;border-bottom:1px solid rgba(26,58,85,.5);vertical-align:middle}
tr:hover td{background:rgba(16,40,64,.6)}
tr.sev-row-5 td{background:rgba(220,38,38,.06)}
tr.sev-row-4 td{background:rgba(239,68,68,.04)}
tr.sev-row-3 td{background:rgba(249,115,22,.04)}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:1000;display:flex;align-items:center;justify-content:center;padding:20px}
.modal{background:var(--card);border:1px solid var(--border);border-radius:16px;max-width:700px;width:100%;max-height:90vh;overflow-y:auto;position:relative}
.modal-header{padding:20px 24px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:var(--card);z-index:1}
.modal-body{padding:24px}
.modal-close{background:transparent;border:none;color:var(--muted);cursor:pointer;font-size:20px;line-height:1;padding:4px 8px;border-radius:4px}
.modal-close:hover{color:#fff;background:rgba(255,255,255,.1)}
#top-progress-bar{position:fixed;top:0;left:0;height:3px;background:var(--cyan);width:0;z-index:9999;transition:width .4s ease;border-radius:0 3px 3px 0}
.loading-overlay{position:fixed;inset:0;background:rgba(13,33,55,.95);z-index:2000;display:flex;align-items:center;justify-content:center}
.loading-card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:40px;width:360px;text-align:center}
.loading-card img{height:32px;margin-bottom:24px}
.loading-msg{color:#fff;font-size:15px;font-weight:500;margin-bottom:20px;min-height:24px;transition:opacity .3s}
.loading-spinner{display:inline-block;width:16px;height:16px;border:2px solid var(--border);border-top-color:var(--cyan);border-radius:50%;animation:spin .8s linear infinite;margin-right:8px;vertical-align:middle}
@keyframes spin{to{transform:rotate(360deg)}}
.progress-wrap{background:#1A3A55;border-radius:20px;height:6px;overflow:hidden;margin-top:20px}
.progress-fill{height:100%;background:var(--cyan);border-radius:20px;transition:width .3s ease}
#app{display:none}
#login-page{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px}
.login-card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:48px 40px;width:100%;max-width:420px;text-align:center}
.login-card img{height:36px;margin-bottom:28px}
.login-title{font-size:22px;font-weight:700;margin-bottom:8px}
.login-sub{color:var(--muted);font-size:13px;margin-bottom:32px;line-height:1.5}
.login-field{text-align:left;margin-bottom:20px}
.login-error{color:#ef4444;font-size:13px;margin-top:12px;display:none}
header{background:var(--navy);border-bottom:1px solid var(--border);padding:0 24px;height:56px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
.header-left{display:flex;align-items:center;gap:12px}
.header-left img{height:28px}
.header-brand{font-weight:700;font-size:15px;color:#fff}
.header-right{display:flex;align-items:center;gap:12px}
.user-name{font-size:13px;color:var(--muted)}
.btn-signout{padding:6px 14px;font-size:13px;border:1px solid var(--border);background:transparent;color:var(--muted);border-radius:6px;cursor:pointer}
.btn-signout:hover{border-color:var(--cyan);color:var(--cyan)}
nav{background:var(--navy);border-bottom:1px solid var(--border);padding:0 24px;display:flex;gap:4px}
.nav-tab{padding:14px 16px;cursor:pointer;color:var(--muted);font-size:13px;font-weight:500;border-bottom:3px solid transparent;transition:all .2s;white-space:nowrap}
.nav-tab:hover{color:#fff}
.nav-tab.active{color:#fff;border-bottom-color:var(--cyan)}
main{padding:28px 24px;max-width:1400px;margin:0 auto}
.page-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px}
.page-title{font-size:22px;font-weight:700}
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:24px}
.stat-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:20px}
.stat-label{color:var(--muted);font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px}
.stat-value{font-size:28px;font-weight:700;color:#fff}
.stat-sub{color:var(--muted);font-size:12px;margin-top:4px}
.alert-banner{background:rgba(245,166,35,.12);border:1px solid rgba(245,166,35,.4);border-radius:10px;padding:16px 20px;margin-bottom:24px;display:flex;align-items:center;justify-content:space-between}
.alert-banner-text{color:var(--orange);font-weight:500}
.section-title{font-size:15px;font-weight:600;margin-bottom:16px;color:#fff}
.filter-bar{display:flex;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.filter-bar input,.filter-bar select{width:auto;flex:1;min-width:140px}
.pagination{display:flex;align-items:center;gap:8px;margin-top:16px;justify-content:flex-end}
.page-btn{padding:6px 12px;border-radius:6px;border:1px solid var(--border);background:transparent;color:var(--muted);cursor:pointer;font-size:13px}
.page-btn:hover{border-color:var(--cyan);color:var(--cyan)}
.page-btn.active{background:var(--cyan);color:#0D2137;border-color:var(--cyan)}
.empty-state{text-align:center;padding:48px;color:var(--muted)}
.wizard-steps{display:flex;align-items:center;gap:0;margin-bottom:28px}
.wizard-step{display:flex;align-items:center;gap:8px;flex:1}
.wizard-step:last-child{flex:0}
.step-circle{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;border:2px solid var(--border);color:var(--muted);flex-shrink:0;transition:all .3s}
.step-circle.active{border-color:var(--cyan);color:var(--cyan);background:rgba(35,227,239,.1)}
.step-circle.done{border-color:var(--cyan);background:var(--cyan);color:#0D2137}
.step-line{flex:1;height:2px;background:var(--border);margin:0 4px;transition:background .3s}
.step-line.done{background:var(--cyan)}
.step-label{font-size:11px;color:var(--muted);white-space:nowrap}
.step-label.active{color:var(--cyan)}
.form-step{display:none}
.form-step.active{display:block}
.form-section{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:24px;margin-bottom:20px}
.form-section h3{font-size:16px;font-weight:600;margin-bottom:4px}
.form-section p{color:var(--muted);font-size:13px;margin-bottom:20px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
.form-group{margin-bottom:16px}
.helper-text{color:var(--muted);font-size:12px;margin-top:4px}
.field-error{color:#ef4444;font-size:12px;margin-top:4px;display:none}
input.invalid,textarea.invalid,select.invalid{border-color:#ef4444}
.readonly-field{background:#0a1e30;border:1px solid rgba(26,58,85,.6);border-radius:6px;padding:10px 12px;color:#fff;font-size:14px}
.readonly-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.readonly-item label{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px}
.info-badge{display:inline-flex;align-items:center;gap:6px;background:rgba(35,227,239,.1);border:1px solid rgba(35,227,239,.3);border-radius:6px;padding:6px 12px;color:var(--cyan);font-size:12px;margin-bottom:16px}
.category-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
.category-card{border:1px solid var(--border);border-radius:8px;padding:12px;cursor:pointer;transition:all .2s;display:flex;align-items:center;gap:10px;font-size:13px}
.category-card:hover{border-color:var(--cyan)}
.category-card.selected{border-color:var(--cyan);background:rgba(35,227,239,.1);color:var(--cyan)}
.category-card input[type=checkbox]{width:16px;height:16px;flex-shrink:0;accent-color:var(--cyan)}
.impact-grid{display:grid;grid-template-columns:repeat(1,1fr);gap:8px;margin-bottom:16px}
.impact-card{border:1px solid var(--border);border-radius:8px;padding:12px 16px;cursor:pointer;transition:all .2s;display:flex;align-items:center;gap:12px;font-size:13px}
.impact-card:hover{border-color:var(--cyan)}
.impact-card.selected{border-color:var(--cyan);background:rgba(35,227,239,.1)}
.impact-card input[type=radio]{accent-color:var(--cyan);width:16px;height:16px}
.severity-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-bottom:20px}
.sev-card{border:2px solid var(--border);border-radius:12px;padding:16px 8px;cursor:pointer;text-align:center;transition:all .2s;position:relative}
.sev-card:hover{transform:translateY(-2px)}
.sev-card.selected-0{border-color:#94a3b8;background:rgba(148,163,184,.1)}
.sev-card.selected-1{border-color:#60a5fa;background:rgba(96,165,250,.1)}
.sev-card.selected-2{border-color:#ca8a04;background:rgba(202,138,4,.1)}
.sev-card.selected-3{border-color:#f97316;background:rgba(249,115,22,.1)}
.sev-card.selected-4{border-color:#ef4444;background:rgba(239,68,68,.1)}
.sev-card.selected-5{border-color:#dc2626;background:rgba(220,38,38,.1);animation:pulse-red 2s infinite}
.sev-num{font-size:28px;font-weight:800;margin-bottom:6px}
.sev-num-0{color:#94a3b8}.sev-num-1{color:#60a5fa}.sev-num-2{color:#ca8a04}.sev-num-3{color:#f97316}.sev-num-4{color:#ef4444}.sev-num-5{color:#dc2626}
.sev-label{font-size:11px;color:var(--muted);font-weight:500;line-height:1.3}
.imm-badge{position:absolute;top:-8px;left:50%;transform:translateX(-50%);background:#dc2626;color:#fff;font-size:9px;font-weight:700;padding:2px 6px;border-radius:4px;white-space:nowrap}
.warning-box{background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.3);border-radius:8px;padding:14px;margin-bottom:20px;color:#ef4444;font-size:13px}
.review-summary{background:#0a1e30;border:1px solid var(--border);border-radius:10px;padding:20px;margin-bottom:20px}
.review-row{display:flex;gap:8px;margin-bottom:8px;font-size:13px}
.review-label{color:var(--muted);min-width:130px;flex-shrink:0}
.review-val{color:#fff}
.char-count{text-align:right;font-size:11px;color:var(--muted);margin-top:4px}
.notification-gate{background:var(--card);border:2px solid var(--orange);border-radius:12px;padding:28px;margin-bottom:24px}
.notification-gate h3{color:var(--orange);font-size:16px;font-weight:700;margin-bottom:12px}
.notification-gate p{color:var(--muted);font-size:13px;line-height:1.7;margin-bottom:20px}
.checkbox-label{display:flex;align-items:flex-start;gap:10px;cursor:pointer;font-size:13px;color:#fff;line-height:1.5;margin-bottom:20px}
.checkbox-label input[type=checkbox]{margin-top:2px;accent-color:var(--cyan);width:16px;height:16px;flex-shrink:0}
.success-card{text-align:center;padding:48px;max-width:560px;margin:0 auto}
.success-icon{width:64px;height:64px;background:rgba(34,197,94,.15);border:2px solid #22c55e;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 24px;font-size:28px}
.info-block{background:#0a1e30;border:1px solid var(--border);border-radius:10px;padding:20px;margin:20px 0;text-align:left}
.info-block-row{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid rgba(26,58,85,.4);font-size:13px}
.info-block-row:last-child{border:none}
.info-block-label{color:var(--muted)}
.threshold-warn{background:rgba(245,166,35,.1);border:1px solid rgba(245,166,35,.4);border-radius:8px;padding:14px;color:var(--orange);font-size:13px;margin-bottom:12px}
.threshold-alert{background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.4);border-radius:8px;padding:14px;color:#ef4444;font-size:13px;margin-bottom:12px}
.admin-panel-sub{display:flex;gap:0;border-bottom:1px solid var(--border);margin-bottom:24px}
.sub-tab{padding:12px 20px;cursor:pointer;color:var(--muted);font-size:13px;font-weight:500;border-bottom:3px solid transparent;transition:all .2s}
.sub-tab:hover{color:#fff}
.sub-tab.active{color:#fff;border-bottom-color:var(--cyan)}
.property-action-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:24px;margin-bottom:20px}
.prop-card-header{display:flex;align-items:center;gap:16px;margin-bottom:16px}
.prop-hotel-id{font-size:20px;font-weight:700}
.action-radio-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px}
.action-radio-card{border:2px solid var(--border);border-radius:10px;padding:16px;cursor:pointer;transition:all .2s}
.action-radio-card:hover{border-color:var(--cyan)}
.action-radio-card.selected{border-color:var(--cyan);background:rgba(35,227,239,.08)}
.action-radio-card input[type=radio]{accent-color:var(--cyan);margin-right:8px}
.action-radio-title{font-weight:600;font-size:14px;margin-bottom:4px}
.action-radio-desc{font-size:12px;color:var(--muted);line-height:1.4}
.reminder-box{background:rgba(245,166,35,.08);border:1px solid rgba(245,166,35,.3);border-radius:8px;padding:14px;margin-bottom:16px;font-size:13px;color:var(--orange)}
.reminder-box-gray{background:rgba(26,58,85,.5);border:1px solid var(--border);border-radius:8px;padding:14px;margin-bottom:16px;font-size:13px;color:var(--muted)}
.sev-bar{display:flex;height:8px;border-radius:4px;overflow:hidden;gap:2px;margin:8px 0}
.sev-bar-seg{height:100%;border-radius:2px}
.inline-spinner{display:inline-flex;align-items:center;gap:8px;padding:12px;color:var(--muted);font-size:13px}
.sort-header{cursor:pointer;user-select:none}
.sort-header:hover{color:#fff}
.sort-header .sort-icon{margin-left:4px;opacity:.5}
.sort-header.asc .sort-icon::after{content:'↑'}
.sort-header.desc .sort-icon::after{content:'↓'}
.sort-header:not(.asc):not(.desc) .sort-icon::after{content:'↕'}
.step-wrap{display:flex;align-items:center;margin-bottom:32px}
.step-item{display:flex;flex-direction:column;align-items:center;position:relative;flex:1}
.step-item:not(:last-child)::after{content:'';position:absolute;top:14px;left:calc(50% + 14px);right:calc(-50% + 14px);height:2px;background:var(--border)}
.step-item.done:not(:last-child)::after,.step-item.active:not(:last-child)::after{background:var(--cyan)}
.step-item .sc{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;border:2px solid var(--border);color:var(--muted);background:var(--dark);position:relative;z-index:1}
.step-item.active .sc{border-color:var(--cyan);color:var(--cyan)}
.step-item.done .sc{border-color:var(--cyan);background:var(--cyan);color:#0D2137}
.step-item .sl{font-size:11px;color:var(--muted);margin-top:6px;white-space:nowrap}
.step-item.active .sl{color:var(--cyan)}
.radio-row{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:4px}
.radio-opt{display:flex;align-items:center;gap:6px;cursor:pointer;font-size:13px;color:var(--muted);padding:8px 14px;border:1px solid var(--border);border-radius:8px;transition:all .2s}
.radio-opt:hover{border-color:var(--cyan);color:#fff}
.radio-opt input[type=radio]{accent-color:var(--cyan)}
.radio-opt.selected{border-color:var(--cyan);color:#fff;background:rgba(35,227,239,.08)}
.no-action-msg{text-align:center;padding:40px;color:var(--muted);background:var(--card);border:1px solid var(--border);border-radius:12px}
th.sortable{cursor:pointer;user-select:none}
th.sortable:hover{color:#fff}
</style>
</head>
<body>
<div id="top-progress-bar"></div>
<div id="loading-overlay" class="loading-overlay" style="display:none">
  <div class="loading-card">
    <img src="heyvacay-logo.svg" alt="HeyVacay"/>
    <div id="loading-msg"><span class="loading-spinner"></span><span id="loading-text">Loading...</span></div>
    <div class="progress-wrap"><div id="loading-progress" class="progress-fill" style="width:0"></div></div>
  </div>
</div>
<div id="login-page">
  <div class="login-card">
    <img src="heyvacay-logo.svg" alt="HeyVacay"/>
    <div class="login-title">HCED Operations Portal</div>
    <div class="login-sub">Hotel Customer Experience Dissatisfaction Management</div>
    <div class="login-field">
      <label for="l-user">Username</label>
      <input type="text" id="l-user" autocomplete="username" placeholder="Enter username"/>
    </div>
    <div class="login-field">
      <label for="l-pass">Password</label>
      <input type="password" id="l-pass" autocomplete="current-password" placeholder="Enter password"/>
    </div>
    <button class="btn btn-primary" id="login-btn" style="width:100%">Sign In</button>
    <div class="login-error" id="login-error">Invalid username or password. Please try again.</div>
  </div>
</div>
<div id="app">
  <header>
    <div class="header-left">
      <img src="heyvacay-logo.svg" alt="HeyVacay"/>
      <span class="header-brand">HCED Portal</span>
    </div>
    <div class="header-right">
      <span class="user-name" id="header-username"></span>
      <span class="badge" id="header-role-badge"></span>
      <button class="btn-signout" onclick="signOut()">Sign Out</button>
    </div>
  </header>
  <nav id="main-nav"></nav>
  <main id="main-content"></main>
</div>
<div id="modal-overlay" class="modal-overlay" style="display:none" onclick="closeModalOnOverlay(event)">
  <div class="modal" id="modal-box">
    <div class="modal-header">
      <div id="modal-title" style="font-size:16px;font-weight:600"></div>
      <button class="modal-close" onclick="closeModal()">×</button>
    </div>
    <div class="modal-body" id="modal-body"></div>
  </div>
</div>
<script>
// ===== DATA =====

// ===== LOADING =====
function showLoading(messages,total,cb){
  const ov=document.getElementById("loading-overlay");
  const txt=document.getElementById("loading-text");
  const prog=document.getElementById("loading-progress");
  ov.style.display="flex";prog.style.width="0";
  let mi=0,elapsed=0;
  txt.textContent=messages[0].text;
  const steps=messages;
  let si=0;
  function next(){
    if(si>=steps.length){prog.style.width="100%";setTimeout(()=>{ov.style.display="none";if(cb)cb();},300);return;}
    txt.style.opacity=0;
    setTimeout(()=>{txt.textContent=steps[si].text;txt.style.opacity=1;},150);
    let dur=steps[si].dur;
    let start=Date.now();
    let startPct=si===0?0:steps.slice(0,si).reduce((a,x)=>a+x.dur,0)/total*100;
    let endPct=steps.slice(0,si+1).reduce((a,x)=>a+x.dur,0)/total*100;
    const frame=()=>{
      const p=(Date.now()-start)/dur;
      prog.style.width=Math.min(startPct+(endPct-startPct)*Math.min(p,1),100)+"%";
      if(p<1)requestAnimationFrame(frame);else{si++;setTimeout(next,50);}
    };
    requestAnimationFrame(frame);
  }
  next();
}
function showTopBar(cb){
  const bar=document.getElementById("top-progress-bar");
  bar.style.width="0";bar.style.transition="none";
  setTimeout(()=>{bar.style.transition="width 0.35s ease";bar.style.width="85%";},10);
  setTimeout(()=>{bar.style.width="100%";setTimeout(()=>{bar.style.width="0";bar.style.transition="none";if(cb)cb();},300);},380);
}

function genId(){
  const d=new Date();
  const ds=d.getFullYear().toString()+(d.getMonth()+1).toString().padStart(2,"0")+d.getDate().toString().padStart(2,"0");
  const r=Math.floor(1000+Math.random()*9000);
  return "HCED-"+ds+"-"+r;
}
function genActId(){return "ACT-"+Date.now();}
function fmtDate(iso){if(!iso)return "-";const d=new Date(iso);return d.toLocaleDateString("en-GB",{day:"2-digit",month:"short",year:"numeric"});}
function fmtDateTime(iso){if(!iso)return "-";const d=new Date(iso);return d.toLocaleDateString("en-GB",{day:"numeric",month:"long",year:"numeric"})+" — "+d.toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"})+" UTC";}
function sevBadge(s){return `<span class="badge sev-${s}">${s} — ${SEV_LABELS[s]}</span>`;}
function sevBadgeShort(s){return `<span class="badge sev-${s}">${s}</span>`;}
function statusBadge(st){const map={"open":"status-open","under_review":"status-under_review","action_taken":"status-action_taken","closed":"status-closed"};const lbl={"open":"Open","under_review":"Under Review","action_taken":"Action Taken","closed":"Closed"};return `<span class="badge ${map[st]||"badge-gray"}">${lbl[st]||st}</span>`;}
function getHotelComplaints(hotelId){return getComplaints().filter(c=>c.property.hotelId===hotelId);}
function hotelHasAction(hotelId){return getActions().some(a=>a.hotelId===hotelId&&(a.action==="remove"||a.action==="suspend"||a.action==="keep"));}

// Returns true if hotel should appear in Admin Panel "Requires Action".
// Handles initial 5-complaint threshold AND re-review thresholds set on prior actions.
function hotelNeedsAdminReview(hotelId){
  const complaints=getComplaints().filter(c=>c.property.hotelId===hotelId);
  const actions=getActions().filter(a=>a.hotelId===hotelId).sort((a,b)=>a.actionedAt.localeCompare(b.actionedAt));
  if(!actions.length) return complaints.length>=5;
  const last=actions[actions.length-1];
  if(last.action==="remove") return false;
  if(!last.reReviewAt) return false;
  const newComplaints=complaints.filter(c=>c.filedAt>last.actionedAt);
  return newComplaints.length>=last.reReviewAt;
}

function getHotelStatus(hotelId){
  const acts=getActions().filter(a=>a.hotelId===hotelId);
  if(!acts.length)return "Monitoring";
  const last=acts[acts.length-1];
  if(last.action==="remove")return "Removed";
  if(last.action==="suspend")return "Suspended";
  if(last.action==="keep")return "Cleared";
  return "Monitoring";
}

  document.getElementById("modal-body").innerHTML=html;

}

function closeModalOnOverlay(e){
  const ov=document.getElementById("modal-overlay");
  if(e.target===ov&&!ov._noClickClose)closeModal();
}

function renderDashboard(){
  const complaints=getComplaints();
  const now=new Date();
  const monthStart=new Date(now.getFullYear(),now.getMonth(),1).toISOString();
  const mc=document.getElementById("main-content");
  if(currentUser.role==="agent"){
    const mine=complaints.filter(c=>c.filedBy.id===currentUser.id);
    const mineMonth=mine.filter(c=>c.filedAt>=monthStart);
    const mineOpen=mine.filter(c=>c.status==="open"||c.status==="under_review");
    const avgSev=mine.length?((mine.reduce((a,c)=>a+c.severity,0)/mine.length).toFixed(1)):"—";
    const recent=mine.slice().sort((a,b)=>b.filedAt.localeCompare(a.filedAt)).slice(0,5);
    mc.innerHTML=`
      <div class="page-header">
        <h1 class="page-title">Dashboard</h1>
        <button class="btn btn-primary" onclick="navigate('new_complaint')">+ File New HCED Complaint</button>
      </div>
      <div class="stat-grid">
        <div class="stat-card"><div class="stat-label">My Complaints This Month</div><div class="stat-value">${mineMonth.length}</div></div>
        <div class="stat-card"><div class="stat-label">Open Complaints</div><div class="stat-value">${mineOpen.length}</div></div>
        <div class="stat-card"><div class="stat-label">Average Severity</div><div class="stat-value">${avgSev}</div></div>
        <div class="stat-card"><div class="stat-label">Total Filed (All Time)</div><div class="stat-value">${mine.length}</div></div>
      </div>
      <div class="section-title">Recent Complaints</div>
      ${recentTable(recent,false)}`;
  } else {
    const actions=getActions();
    const actionsMonth=actions.filter(a=>a.actionedAt>=monthStart);
    const allOpen=complaints.filter(c=>c.status==="open"||c.status==="under_review");
    const hotelIds=[...new Set(complaints.map(c=>c.property.hotelId))];
    const atThreshold=hotelIds.filter(id=>hotelNeedsAdminReview(id));
    const nearing=hotelIds.filter(id=>{
      const hc=getHotelComplaints(id);
      return (hc.length===3||hc.length===4)&&!hotelNeedsAdminReview(id)&&!hotelHasAction(id);
    });
    const recent=complaints.slice().sort((a,b)=>b.filedAt.localeCompare(a.filedAt)).slice(0,10);
    mc.innerHTML=`
      <div class="page-header"><h1 class="page-title">Dashboard</h1><button class="btn btn-primary" onclick="navigate('new_complaint')">+ File New HCED Complaint</button></div>
      <div class="stat-grid">
        <div class="stat-card"><div class="stat-label">Total Complaints</div><div class="stat-value">${complaints.length}</div></div>
        <div class="stat-card"><div class="stat-label">Open / Pending Review</div><div class="stat-value">${allOpen.length}</div></div>
        <div class="stat-card"><div class="stat-label">Properties at Threshold</div><div class="stat-value" style="color:${atThreshold.length>0?"#ef4444":"#fff"}">${atThreshold.length}</div></div>
        <div class="stat-card"><div class="stat-label">Actions Taken This Month</div><div class="stat-value">${actionsMonth.length}</div></div>
      </div>
      ${atThreshold.length>0?`<div class="alert-banner"><span class="alert-banner-text">⚠ ${atThreshold.length} hotel(s) have reached the review threshold and require admin action.</span><button class="btn btn-sm" style="background:var(--orange);color:#0D2137;border:none;cursor:pointer" onclick="navigate('admin_panel')">Go to Admin Panel</button></div>`:""}

      ${nearing.length>0?`<div class="section-title" style="margin-top:24px">Properties Nearing Threshold</div>${nearingTable(nearing)}`:""}`;

let wizardState={};
function renderNewComplaint(){
  wizardState={step:0,gate:false,data:{},id:genId()};
  showGate();
}
function showGate(){
  const mc=document.getElementById("main-content");
  mc.innerHTML=`
    <div class="page-header"><h1 class="page-title">New Complaint</h1></div>
    <div class="notification-gate">
      <h3>⚠ Required: Property Notification</h3>
      <p>Before filing this complaint, you are required to notify the hotel property directly via email so they are aware that HeyVacay is logging this dissatisfaction event. Properties must be informed of how our HCED system works so they can address issues proactively. Do not proceed until you have done this.</p>
      <label class="checkbox-label">
        <input type="checkbox" id="gate-cb" onchange="gateCheck()"/>
        I confirm that I have notified the hotel property of this complaint via email before submitting.
      </label>
      <button class="btn btn-primary" id="gate-btn" disabled onclick="startWizard()">Begin Complaint Form</button>
    </div>`;
}
function gateCheck(){
  const cb=document.getElementById("gate-cb");
  const btn=document.getElementById("gate-btn");
  if(cb.checked){btn.disabled=false;btn.style.opacity="1";}
  else{btn.disabled=true;}
}
function startWizard(){
  wizardState.gate=true;wizardState.step=1;
  renderWizard();
}

function stepWrap(stepLabels,current){
  return `<div class="step-wrap">${stepLabels.map((l,i)=>{
    const n=i+1;
    const cls=n<current?"done":n===current?"active":"";
    return `<div class="step-item ${cls}"><div class="sc">${n<current?"✓":n}</div><div class="sl">${l}</div></div>`;
  }).join("")}</div>`;
}

function renderWizard(){
  const mc=document.getElementById("main-content");
  const steps=["Agent Info","Guest Info","Property","Complaint Details","Review & Submit"];
  mc.innerHTML=`
    <div class="page-header"><h1 class="page-title">New Complaint — Step ${wizardState.step} of 5</h1></div>
    ${stepWrap(steps,wizardState.step)}
    <div id="wizard-body"></div>`;
  renderWizardStep();
}

function renderWizardStep(){
  const wb=document.getElementById("wizard-body");
  const s=wizardState.step;
  if(s===1)wb.innerHTML=step1HTML();
  else if(s===2)wb.innerHTML=step2HTML();
  else if(s===3)wb.innerHTML=step3HTML();
  else if(s===4)wb.innerHTML=step4HTML();
  else if(s===5)wb.innerHTML=step5HTML();
  afterStepRender();
}

function afterStepRender(){
  // restore saved values
  const d=wizardState.data;
  const s=wizardState.step;
  if(s===2){
    setVal("g-name",d.guestName);setVal("g-email",d.guestEmail);setVal("g-phone",d.guestPhone);
    setVal("g-resid",d.reservationId);setVal("g-checkin",d.checkIn);setVal("g-checkout",d.checkOut);
    setVal("g-room",d.roomType);setVal("g-guests",d.numGuests);
  }
  if(s===3){
    setVal("p-hid",d.hotelId);setVal("p-hname",d.hotelName);setVal("p-city",d.city);
    setVal("p-country",d.country);setVal("p-email",d.hotelEmail);setVal("p-supplier",d.supplier);
  }
  if(s===4){
    if(d.categories){d.categories.forEach(cat=>{const cb=document.querySelector(`.cat-cb[data-cat="${CSS.escape(cat)}"]`);if(cb){cb.checked=true;cb.closest(".category-card").classList.add("selected");}});}
    setVal("c-summary",d.summary);
    if(d.reportedToStaff)selectRadioOpt("rts",d.reportedToStaff);
    if(d.impactLevel)selectRadioOpt("impact",d.impactLevel);
    if(d.evidenceAvailable)selectRadioOpt("evid",d.evidenceAvailable);
    if(d.chargesDisputed)selectRadioOpt("chdisp",d.chargesDisputed);
    if(d.staffResponse)setVal("c-staffresp",d.staffResponse);
    if(d.evidenceDescription)setVal("c-eviddesc",d.evidenceDescription);
    if(d.totalLoss)setVal("c-totalloss",d.totalLoss);
    updateCharCount();
    toggleStaffResp();toggleEvidDesc();toggleTotalLoss();
  }
  if(s===5){
    if(d.severity!==undefined)selectSeverity(d.severity);
    updateReviewSummary();
  }
}

function setVal(id,val){const el=document.getElementById(id);if(el&&val!==undefined&&val!==null)el.value=val;}
function selectRadioOpt(name,val){
  document.querySelectorAll(`.radio-opt[data-name="${name}"]`).forEach(opt=>{
    if(opt.dataset.val===val){opt.classList.add("selected");opt.querySelector("input").checked=true;}
    else{opt.classList.remove("selected");opt.querySelector("input").checked=false;}
  });
}

function toggleCat(card){
  const cb=card.querySelector("input[type=checkbox]");
  cb.checked=!cb.checked;
  card.classList.toggle("selected",cb.checked);
}
function updateCharCount(){
  const el=document.getElementById("c-summary");
  const cc=document.getElementById("char-count");
  if(el&&cc)cc.textContent=(el.value.length)+" characters";
}
function selectRadio(el,name){
  document.querySelectorAll(`.radio-opt[data-name="${name}"],.impact-card[data-name="${name}"]`).forEach(o=>o.classList.remove("selected"));
  el.classList.add("selected");
  el.querySelector("input").checked=true;
}
function toggleStaffResp(){
  const sel=document.querySelector('.radio-opt[data-name="rts"].selected');
  const wrap=document.getElementById("staff-resp-wrap");
  if(wrap)wrap.style.display=(sel&&sel.dataset.val==="yes")?"block":"none";
}

  const sel=document.querySelector('.radio-opt[data-name="evid"].selected');
  const wrap=document.getElementById("evid-desc-wrap");
  if(wrap)wrap.style.display=(sel&&sel.dataset.val==="yes")?"block":"none";
}

  const sel=document.querySelector('.radio-opt[data-name="chdisp"].selected');
  const wrap=document.getElementById("total-loss-wrap");
  if(wrap)wrap.style.display=(sel&&sel.dataset.val==="yes")?"block":"none";

  const evid=document.querySelector('.radio-opt[data-name="evid"].selected');
  if(!evid){showErr("e-evid");ok=false;}else{hideErr("e-evid");}
  const chdisp=document.querySelector('.radio-opt[data-name="chdisp"].selected');

  // Show email confirmation modal before proceeding
  showEmailConfirmModal({
    title:"Hotel Notification — Email Confirmation",
    intro:`Before this complaint is submitted, confirm that you have sent a notification email to the hotel property${d.hotelEmail?" ("+d.hotelEmail+")":""}. Paste the email body below — it will be permanently recorded alongside this complaint.`,
    bodyLabel:"Email Body Sent to Hotel (paste here)",
    bodyPlaceholder:"Paste the full text of the notification email you sent to the hotel property...",
    confirmBtnText:"I have sent this email — Submit Complaint",
    isSupervisor:false,
    onConfirm(emailBody){
      _doSubmitComplaint(d, emailBody);
    }
  });
}

function _doSubmitComplaint(d, notificationEmailBody){
  const complaint={
    id:wizardState.id,
    filedBy:{id:currentUser.id,name:currentUser.name,title:currentUser.title},
    filedAt:d.filedAt||new Date().toISOString(),
    notificationConfirmed:true,
    notificationEmailBody:notificationEmailBody||"",
    guest:{name:d.guestName,email:d.guestEmail,phone:d.guestPhone||"",reservationId:d.reservationId,checkIn:d.checkIn,checkOut:d.checkOut,roomType:d.roomType||"",numGuests:d.numGuests||""},
    property:{hotelId:d.hotelId,hotelName:d.hotelName||"",city:d.city||"",country:d.country||"",hotelEmail:d.hotelEmail||"",supplier:d.supplier||""},
    complaint:{categories:d.categories,summary:d.summary,reportedToStaff:d.reportedToStaff,staffResponse:d.staffResponse||"",impactLevel:d.impactLevel,evidenceAvailable:d.evidenceAvailable,evidenceDescription:d.evidenceDescription||""},
    chargesDisputed:d.chargesDisputed||"no",
    totalLoss:d.totalLoss||null,
    severity:d.severity,
    status:"open",
    certificationConfirmed:true
  };
  showLoading([
    {text:"Validating complaint data...",dur:700},
    {text:"Registering complaint record...",dur:800},
    {text:"Checking hotel threshold status...",dur:700},
    {text:"Complaint filed successfully.",dur:800}
  ],3000,()=>{
    const complaints=getComplaints();
    complaints.push(complaint);
    const hotelComplaints=complaints.filter(c=>c.property.hotelId===complaint.property.hotelId);
    // mark under_review if initial threshold OR re-review threshold hit
    if(hotelNeedsAdminReview(complaint.property.hotelId)){
      hotelComplaints.forEach(c=>{if(c.status==="open"||c.status==="action_taken")c.status="under_review";});
    } else if(hotelComplaints.length>=5&&!hotelHasAction(complaint.property.hotelId)){
      hotelComplaints.forEach(c=>{if(c.status==="open")c.status="under_review";});
    }
    saveComplaints(complaints);
    showConfirmation(complaint,hotelComplaints.length);
  });
}

  let thresholdHtml="";
  if(hotelCount===4)thresholdHtml=`<div class="threshold-warn">⚠ Note: This property now has 4 complaints on record. One more will trigger admin review.</div>`;

function crFilter(){
  crState.search=document.getElementById("cr-search").value;
  crState.hotelId=document.getElementById("cr-hid").value;
  crState.agent=document.getElementById("cr-agent").value;
  crState.sev=document.getElementById("cr-sev").value;
  crState.status=document.getElementById("cr-status").value;
  crState.dateFrom=document.getElementById("cr-from").value;
  crState.dateTo=document.getElementById("cr-to").value;
  crState.page=1;renderCRTable();
}
function getFilteredComplaints(){
  let items=getComplaints();
  const s=crState;
  if(s.search){const q=s.search.toLowerCase();items=items.filter(c=>c.id.toLowerCase().includes(q));}
  if(s.hotelId){const q=s.hotelId.toLowerCase();items=items.filter(c=>c.property.hotelId.toLowerCase().includes(q));}
  if(s.agent!=="all")items=items.filter(c=>c.filedBy.id===s.agent);
  if(s.sev!=="all")items=items.filter(c=>c.severity==s.sev);
  if(s.status!=="all")items=items.filter(c=>c.status===s.status);
  if(s.dateFrom)items=items.filter(c=>c.filedAt>=s.dateFrom);
  if(s.dateTo)items=items.filter(c=>c.filedAt<=s.dateTo+"T23:59:59");
  // sort
  items.sort((a,b)=>{
    let av=a,bv=b;
    if(s.sortCol==="id")return s.sortDir==="asc"?a.id.localeCompare(b.id):b.id.localeCompare(a.id);
    if(s.sortCol==="hotelId")return s.sortDir==="asc"?a.property.hotelId.localeCompare(b.property.hotelId):b.property.hotelId.localeCompare(a.property.hotelId);
    if(s.sortCol==="filedBy")return s.sortDir==="asc"?a.filedBy.name.localeCompare(b.filedBy.name):b.filedBy.name.localeCompare(a.filedBy.name);
    if(s.sortCol==="filedAt")return s.sortDir==="asc"?a.filedAt.localeCompare(b.filedAt):b.filedAt.localeCompare(a.filedAt);
    if(s.sortCol==="severity")return s.sortDir==="asc"?a.severity-b.severity:b.severity-a.severity;
    if(s.sortCol==="status")return s.sortDir==="asc"?a.status.localeCompare(b.status):b.status.localeCompare(a.status);
    return 0;
  });
  return items;
}
function crSort(col){
  if(crState.sortCol===col)crState.sortDir=crState.sortDir==="asc"?"desc":"asc";
  else{crState.sortCol=col;crState.sortDir="asc";}
  renderCRTable();
}
function renderCRTable(){
  const items=getFilteredComplaints();

    </tr>`).join("")}</tbody>
  </table>
  ${paginator(page,pages,"crPage")}`;
}

function exportCSV(){
  const items=getFilteredComplaints();

  const rows=items.map(c=>[c.id,c.property.hotelId,c.property.hotelName||"",c.filedBy.name,c.filedAt,c.severity,SEV_LABELS[c.severity],c.complaint.impactLevel,c.status,c.complaint.categories.join("|"),c.complaint.summary.replace(/"/g,'""')]);
  const csv=[headers,...rows].map(r=>r.map(f=>`"${f}"`).join(",")).join("\n");

}

      </div>`;
  return `<div class="property-action-card" id="pac-${hotelId}">
    <div class="prop-card-header">
      <div>
        <div class="prop-hotel-id">${hotelId}</div>
        ${hotelName?`<div style="color:var(--muted);font-size:13px">${hotelName}</div>`:""}
      </div>
      <span class="badge badge-red" style="font-size:13px">${complaints.length} COMPLAINTS — REVIEW REQUIRED</span>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px;font-size:13px">
      <div><span style="color:var(--muted)">Hotel Email: </span>${hotelEmail||"Not on record"}</div>
      <div><span style="color:var(--muted)">Severity breakdown: </span>${sevBreak}</div>
      <div><span style="color:var(--muted)">Most recent complaint: </span>${fmtDate(complaints[0]?.filedAt)}</div>
      <div><span style="color:var(--muted)">Total complaints: </span><strong>${complaints.length}</strong></div>
    </div>
    <div style="margin-bottom:16px">
      <div class="section-title" style="font-size:13px">Complaint History</div>
      <table style="font-size:12px">
        <thead><tr><th>HCED ID</th><th>Date</th><th>Agent</th><th>Severity</th><th>Categories</th></tr></thead>
        <tbody>${complaints.map(c=>`<tr>
          <td style="font-family:monospace">${c.id}</td>
          <td>${fmtDate(c.filedAt)}</td><td>${c.filedBy.name}</td>
          <td>${sevBadgeShort(c.severity)}</td>
          <td>${c.complaint.categories.slice(0,2).join(", ")}</td>
        </tr>`).join("")}</tbody>
      </table>
      <div style="margin-top:8px"><a href="#" style="color:var(--cyan);font-size:13px" onclick="event.preventDefault();navigate('hotel_lookup');setTimeout(()=>{const el=document.getElementById('hl-search');if(el){el.value='${hotelId}';doHotelSearch();}},100)">View All Complaints for This Hotel →</a></div>
    </div>
    ${emailSection}
    <div id="action-form-${hotelId}" ${hotelEmail?"":"style='pointer-events:none;opacity:.4;'"}>
      <div class="section-title" style="font-size:13px;margin-bottom:12px">Select Administrative Action</div>
      <div class="action-radio-grid">
        <div class="action-radio-card" id="arc-remove-${hotelId}" onclick="selectAction('${hotelId}','remove')">
          <div><input type="radio" name="action-${hotelId}" value="remove"/> <strong>Remove from Platform</strong></div>
          <div class="action-radio-desc" style="margin-top:6px">This property will be flagged for removal from all HeyVacay inventory sources. Requires documented justification.</div>
        </div>
        <div class="action-radio-card" id="arc-suspend-${hotelId}" onclick="selectAction('${hotelId}','suspend')">
          <div><input type="radio" name="action-${hotelId}" value="suspend"/> <strong>Suspend (Temporary)</strong></div>
          <div class="action-radio-desc" style="margin-top:6px">Suspend this property for a defined period. Guests will not be able to book during suspension.</div>
        </div>
        <div class="action-radio-card" id="arc-keep-${hotelId}" onclick="selectAction('${hotelId}','keep')">
          <div><input type="radio" name="action-${hotelId}" value="keep"/> <strong>Keep & Monitor</strong></div>
          <div class="action-radio-desc" style="margin-top:6px">Retain the property in inventory but continue monitoring. Define when this property should re-appear in this panel.</div>
        </div>
      </div>
      <div id="action-extra-${hotelId}"></div>
      <div class="form-group" style="border-top:1px solid var(--border);padding-top:16px">
        <label>Were any charges disputed in relation to this decision?</label>
        <div class="radio-row">
          <label class="radio-opt" data-name="adm-chdisp-${hotelId}" data-val="yes" onclick="selectAdminDisp(this,'${hotelId}')"><input type="radio" name="adm-chdisp-${hotelId}" value="yes"/> Yes</label>
          <label class="radio-opt" data-name="adm-chdisp-${hotelId}" data-val="no" onclick="selectAdminDisp(this,'${hotelId}')"><input type="radio" name="adm-chdisp-${hotelId}" value="no"/> No</label>
        </div>
      </div>
      <div id="adm-loss-wrap-${hotelId}" style="display:none" class="form-group">
        <label>Total Loss Amount (USD)</label>
        <input type="number" id="adm-totalloss-${hotelId}" min="0" step="0.01" placeholder="Transaction total + dispute/chargeback fee"/>
      </div>
      <div class="form-group">
        <label>Administrative Comment (Required)</label>
        <textarea id="action-comment-${hotelId}" rows="4" minlength="30" placeholder="Document the reason for this decision, any communications with the property, and any relevant context. This comment is permanently recorded and cannot be edited after submission."></textarea>
        <div class="field-error" id="e-ac-${hotelId}">Comment must be at least 30 characters</div>
      </div>
      <button class="btn btn-primary" onclick="submitAdminAction('${hotelId}')">Confirm & Submit Action</button>
    </div>
  </div>`;
}

function selectAdminDisp(el,hotelId){
  document.querySelectorAll(`[data-name="adm-chdisp-${hotelId}"]`).forEach(o=>o.classList.remove("selected"));
  el.classList.add("selected");el.querySelector("input").checked=true;
  const wrap=document.getElementById("adm-loss-wrap-"+hotelId);
  if(wrap)wrap.style.display=el.dataset.val==="yes"?"block":"none";
}

function checkNotifyCb(hotelId){
  const cb=document.getElementById("notify-cb-"+hotelId);
  const form=document.getElementById("action-form-"+hotelId);
  if(form){form.style.pointerEvents=cb.checked?"auto":"none";form.style.opacity=cb.checked?"1":"0.4";}
}

function selectAction(hotelId,action){
  ["remove","suspend","keep"].forEach(a=>{
    const el=document.getElementById("arc-"+a+"-"+hotelId);
    if(el)el.classList.toggle("selected",a===action);
  });
  const extra=document.getElementById("action-extra-"+hotelId);
  if(action==="suspend"){
    extra.innerHTML=`
      <div class="form-row" style="margin-bottom:16px">
        <div class="form-group"><label>Suspension Duration</label><div style="display:flex;gap:8px"><input type="number" id="susp-val-${hotelId}" min="1" placeholder="e.g. 30" style="width:100px"/><select id="susp-unit-${hotelId}"><option>Days</option><option>Weeks</option><option>Months</option></select></div></div>
        <div class="form-group"><label>Re-Review At</label><input type="number" id="rereview-${hotelId}" min="1" placeholder="After N additional complaints"/></div>
      </div>`;
  } else if(action==="keep"){
    extra.innerHTML=`<div class="form-group" style="margin-bottom:16px"><label>Re-Review At</label><input type="number" id="rereview-${hotelId}" min="1" placeholder="Re-trigger admin review after N additional complaints (from current count)"/></div>`;
  } else {
    extra.innerHTML="";
  }
}

function bindActionForm(hotelId){}

function submitAdminAction(hotelId){
  const comment=document.getElementById("action-comment-"+hotelId)?.value||"";
  if(comment.length<30){document.getElementById("e-ac-"+hotelId).style.display="block";return;}
  document.getElementById("e-ac-"+hotelId).style.display="none";
  const actionEl=document.querySelector(`input[name="action-${hotelId}"]:checked`);
  if(!actionEl){alert("Please select an action.");return;}
  const action=actionEl.value;
  const complaints=getComplaints().filter(c=>c.property.hotelId===hotelId);
  const hotelName=complaints.find(c=>c.property.hotelName)?.property.hotelName||"";
  const hotelEmail=complaints.find(c=>c.property.hotelEmail)?.property.hotelEmail||"";
  const hotelNotified=!!(document.getElementById("notify-cb-"+hotelId)?.checked||hotelEmail);
  let suspensionDuration=null,reReviewAt=null;
  if(action==="suspend"){
    const val=document.getElementById("susp-val-"+hotelId)?.value;
    const unit=document.getElementById("susp-unit-"+hotelId)?.value;
    if(val)suspensionDuration={value:parseInt(val),unit};
    const rr=document.getElementById("rereview-"+hotelId)?.value;
    if(rr&&parseInt(rr)>0)reReviewAt=parseInt(rr);
  } else if(action==="keep"){
    const rr=document.getElementById("rereview-"+hotelId)?.value;
    if(rr&&parseInt(rr)>0)reReviewAt=parseInt(rr);
  }
  const admDispEl=document.querySelector(`[data-name="adm-chdisp-${hotelId}"].selected`);
  const admChargesDisputed=admDispEl?admDispEl.dataset.val:"no";
  const admTotalLoss=admChargesDisputed==="yes"?(parseFloat(document.getElementById("adm-totalloss-"+hotelId)?.value)||null):null;

  // Always show email confirmation modal before proceeding
  const actionLabels={"remove":"Remove from Platform","suspend":"Suspend (Temporary)","keep":"Keep & Monitor"};
  showEmailConfirmModal({
    title: action==="remove" ? "Supervisor Notification — Email Confirmation" : "Administrative Action — Email Confirmation",
    intro: action==="remove"
      ? `You are about to remove <strong>${hotelId}${hotelName?" ("+hotelName+")":""}</strong> from the platform. You must notify your direct supervisor and paste the email body below. This is permanently recorded.`
      : `You are about to record an administrative action (<strong>${actionLabels[action]}</strong>) for <strong>${hotelId}</strong>. Paste the email body of any notification you sent below — this will be permanently recorded alongside this action.`,
    bodyLabel: action==="remove" ? "Supervisor Email Body (paste here)" : "Notification Email Body (paste here)",
    bodyPlaceholder: action==="remove"
      ? "Paste the full email you sent to your supervisor requesting removal of this property..."
      : "Paste the full text of the notification email sent in relation to this action...",
    confirmBtnText: action==="remove" ? "I have done this — Confirm Removal" : "I have sent this email — Confirm Action",
    isSupervisor: action==="remove",
    onConfirm(emailBody){
      _doSubmitAdminAction({hotelId,hotelName,action,suspensionDuration,reReviewAt,comment,complaints,hotelNotified,hotelEmail,admChargesDisputed,admTotalLoss,emailBody});
    }
  });
}

function _doSubmitAdminAction({hotelId,hotelName,action,suspensionDuration,reReviewAt,comment,complaints,hotelNotified,hotelEmail,admChargesDisputed,admTotalLoss,emailBody}){
  showLoading([
    {text:"Processing administrative directive...",dur:900},
    {text:"Updating property status...",dur:800},
    {text:"Action recorded.",dur:800}
  ],2500,()=>{
    const act={
      id:genActId(),hotelId,hotelName,action,suspensionDuration,reReviewAt,comment,
      actionedBy:{id:currentUser.id,name:currentUser.name},
      actionedAt:new Date().toISOString(),
      relatedComplaintIds:complaints.map(c=>c.id),
      hotelNotified,hotelEmail:hotelEmail||null,
      chargesDisputed:admChargesDisputed,totalLoss:admTotalLoss,
      notificationEmailBody:emailBody||""
    };
    const actions=getActions();actions.push(act);saveActions(actions);
    const allComplaints=getComplaints();
    allComplaints.forEach(c=>{if(c.property.hotelId===hotelId)c.status="action_taken";});
    saveComplaints(allComplaints);
    navigate("admin_panel");
  });
}

function renderAllMonitored(el){
  const complaints=getComplaints();
  const hotelIds=[...new Set(complaints.map(c=>c.property.hotelId))];
  if(!hotelIds.length){el.innerHTML=`<div class="no-action-msg">No properties on record.</div>`;return;}
  const rows=hotelIds.map(id=>{
    const hc=complaints.filter(c=>c.property.hotelId===id).sort((a,b)=>b.filedAt.localeCompare(a.filedAt));
    const name=hc.find(c=>c.property.hotelName)?.property.hotelName||"—";
    const maxSev=Math.max(...hc.map(c=>c.severity));
    const status=getHotelStatus(id);
    const needsAction=hotelNeedsAdminReview(id);
    const statusBadgeHtml=needsAction?`<span class="badge badge-red">Pending Admin Review</span>`:
      status==="Removed"?`<span class="badge badge-gray">Removed</span>`:
      status==="Suspended"?`<span class="badge badge-orange">Suspended</span>`:
      status==="Cleared"?`<span class="badge badge-green">Cleared</span>`:
      `<span class="badge badge-cyan">Monitoring</span>`;
    return {id,name,count:hc.length,maxSev,lastDate:hc[0]?.filedAt,statusBadgeHtml,status};
  });
  el.innerHTML=`<table>
    <thead><tr><th>Hotel ID</th><th>Hotel Name</th><th>Total Complaints</th><th>Highest Severity</th><th>Last Complaint</th><th>Status</th><th>Actions</th></tr></thead>
    <tbody>${rows.map(r=>`<tr>
      <td><strong>${r.id}</strong></td><td>${r.name}</td>
      <td>${r.count}</td><td>${sevBadgeShort(r.maxSev)}</td>
      <td>${fmtDate(r.lastDate)}</td><td>${r.statusBadgeHtml}</td>
      <td><button class="btn btn-sm btn-secondary" onclick="navigate('hotel_lookup');setTimeout(()=>{const el=document.getElementById('hl-search');if(el){el.value='${r.id}';doHotelSearch();}},100)">View</button></td>
    </tr>`).join("")}</tbody>
  </table>`;
}

// ===== COMPLETED ACTIONS =====
let caState={search:"",actionType:"all",dateFrom:"",dateTo:"",admin:"all",page:1};
function renderCompletedActions(){
  const mc=document.getElementById("main-content");
  const admins=[...new Set(getActions().map(a=>a.actionedBy.id))].map(id=>{const ac=getActions().find(x=>x.actionedBy.id===id);return{id,name:ac.actionedBy.name};});
  mc.innerHTML=`
    <div class="page-header"><h1 class="page-title">Completed Actions</h1></div>
    <div class="filter-bar">
      <input type="text" placeholder="Hotel ID..." id="ca-search" oninput="caFilter()"/>
      <select id="ca-type" onchange="caFilter()">
        <option value="all">All Action Types</option>
        <option value="remove">Remove</option>
        <option value="suspend">Suspend</option>
        <option value="keep">Keep & Monitor</option>
      </select>
      <input type="date" id="ca-from" onchange="caFilter()" title="From date"/>
      <input type="date" id="ca-to" onchange="caFilter()" title="To date"/>
      <select id="ca-admin" onchange="caFilter()">
        <option value="all">All Admins</option>
        ${admins.map(a=>`<option value="${a.id}">${a.name}</option>`).join("")}
      </select>
    </div>
    <div id="ca-table"></div>`;
  renderCATable();
}
function caFilter(){
  caState.search=document.getElementById("ca-search").value;
  caState.actionType=document.getElementById("ca-type").value;
  caState.dateFrom=document.getElementById("ca-from").value;
  caState.dateTo=document.getElementById("ca-to").value;
  caState.admin=document.getElementById("ca-admin").value;
  caState.page=1;renderCATable();
}
function renderCATable(){
  let items=getActions();
  const s=caState;
  if(s.search){const q=s.search.toLowerCase();items=items.filter(a=>a.hotelId.toLowerCase().includes(q));}
  if(s.actionType!=="all")items=items.filter(a=>a.action===s.actionType);
  if(s.dateFrom)items=items.filter(a=>a.actionedAt>=s.dateFrom);
  if(s.dateTo)items=items.filter(a=>a.actionedAt<=s.dateTo+"T23:59:59");
  if(s.admin!=="all")items=items.filter(a=>a.actionedBy.id===s.admin);
  items.sort((a,b)=>b.actionedAt.localeCompare(a.actionedAt));
  const perPage=15,total=items.length,pages=Math.ceil(total/perPage);
  const page=Math.min(s.page,pages||1);
  const slice=items.slice((page-1)*perPage,page*perPage);
  const tb=document.getElementById("ca-table");
  if(!items.length){tb.innerHTML=`<div class="empty-state">No completed actions on record.</div>`;return;}
  const actionLabel={"remove":"Remove from Platform","suspend":"Suspend (Temporary)","keep":"Keep & Monitor"};
  tb.innerHTML=`<table>
    <thead><tr><th>Hotel ID</th><th>Hotel Name</th><th>Action Taken</th><th>Action Date</th><th>Actioned By</th><th>Comment</th><th>View</th></tr></thead>
    <tbody>${slice.map(a=>`<tr>
      <td><strong>${a.hotelId}</strong></td><td>${a.hotelName||"—"}</td>
      <td><span class="badge ${a.action==="remove"?"badge-red":a.action==="suspend"?"badge-orange":"badge-green"}">${actionLabel[a.action]||a.action}</span></td>
      <td>${fmtDate(a.actionedAt)}</td><td>${a.actionedBy.name}</td>
      <td style="max-width:200px;font-size:12px;color:var(--muted)">${a.comment.slice(0,80)}${a.comment.length>80?"...":""}</td>
      <td><button class="btn btn-sm btn-secondary" onclick="viewActionModal('${a.id}')">View</button></td>
    </tr>`).join("")}</tbody>
  </table>
  ${paginator(page,pages,"caPage")}`;
}
window.caPage=function(p){caState.page=p;renderCATable();};

function viewActionModal(id){
  const a=getActions().find(x=>x.id===id);
  if(!a)return;
  const actionLabel={"remove":"Remove from Platform","suspend":"Suspend (Temporary)","keep":"Keep & Monitor"};
  const relComplaints=getComplaints().filter(c=>a.relatedComplaintIds.includes(c.id));
  const html=`
    <div class="review-summary">
      <div class="review-row"><span class="review-label">Hotel ID</span><span class="review-val">${a.hotelId}</span></div>
      <div class="review-row"><span class="review-label">Hotel Name</span><span class="review-val">${a.hotelName||"—"}</span></div>
      <div class="review-row"><span class="review-label">Hotel Email</span><span class="review-val">${a.hotelEmail||"Not on record"}</span></div>
      <div class="review-row"><span class="review-label">Action Taken</span><span class="review-val"><span class="badge ${a.action==="remove"?"badge-red":a.action==="suspend"?"badge-orange":"badge-green"}">${actionLabel[a.action]}</span></span></div>
      <div class="review-row"><span class="review-label">Action Date</span><span class="review-val">${fmtDateTime(a.actionedAt)}</span></div>
      <div class="review-row"><span class="review-label">Actioned By</span><span class="review-val">${a.actionedBy.name}</span></div>
      <div class="review-row"><span class="review-label">Hotel Notified</span><span class="review-val">${a.hotelNotified?"Yes":"No"}</span></div>
      ${a.suspensionDuration?`<div class="review-row"><span class="review-label">Suspension Duration</span><span class="review-val">${a.suspensionDuration.value} ${a.suspensionDuration.unit}</span></div>`:""}
      ${a.reReviewAt?`<div class="review-row"><span class="review-label">Re-Review After</span><span class="review-val">${a.reReviewAt} additional complaints</span></div>`:""}
      <div class="review-row"><span class="review-label">Charges Disputed</span><span class="review-val">${a.chargesDisputed==="yes"?`Yes${a.totalLoss!=null?" — <strong style='color:#ef4444'>$"+Number(a.totalLoss).toFixed(2)+" total loss</strong>":" — amount not recorded"}`:"No"}</span></div>
      <div class="review-row" style="flex-direction:column;gap:6px"><span class="review-label">Administrative Comment</span><span class="review-val" style="line-height:1.6">${a.comment}</span></div>
    </div>
    ${a.notificationEmailBody?`<div style="font-size:13px;font-weight:600;color:var(--muted);margin:16px 0 8px">${a.action==="remove"?"SUPERVISOR":"NOTIFICATION"} EMAIL (RECORDED)</div><div style="background:#0a1e30;border:1px solid rgba(35,227,239,.2);border-radius:8px;padding:14px;font-size:12px;color:var(--muted);white-space:pre-wrap;line-height:1.7;font-family:monospace;max-height:200px;overflow-y:auto">${a.notificationEmailBody.replace(/</g,'&lt;')}</div>`:""}
    ${relComplaints.length?`<div style="font-size:13px;font-weight:600;color:var(--muted);margin:16px 0 8px">RELATED COMPLAINTS (${relComplaints.length})</div>
    <table style="font-size:12px">
      <thead><tr><th>HCED ID</th><th>Date</th><th>Severity</th><th>Agent</th></tr></thead>
      <tbody>${relComplaints.map(c=>`<tr><td style="font-family:monospace">${c.id}</td><td>${fmtDate(c.filedAt)}</td><td>${sevBadgeShort(c.severity)}</td><td>${c.filedBy.name}</td></tr>`).join("")}</tbody>
    </table>`:""}`;
  openModal("Action — "+a.hotelId,html);
}

// ===== PAGINATION HELPER =====
function paginator(page,pages,cbName){
  if(pages<=1)return "";
  let html=`<div class="pagination"><span style="color:var(--muted);font-size:12px">Page ${page} of ${pages}</span>`;
  if(page>1)html+=`<button class="page-btn" onclick="${cbName}(${page-1})">←</button>`;
  const start=Math.max(1,page-2),end=Math.min(pages,page+2);
  for(let i=start;i<=end;i++)html+=`<button class="page-btn ${i===page?"active":""}" onclick="${cbName}(${i})">${i}</button>`;
  if(page<pages)html+=`<button class="page-btn" onclick="${cbName}(${page+1})">→</button>`;
  html+=`</div>`;
  return html;
}
